name: Build & Release App

on:
  push:
    tags:
      - 'v*' # Triggers on tag push starting with 'v' (e.g., v1.0.0)
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write # Required to create/upload release assets

env:
  VERSION: ''

jobs:
  # -------------------------------------------------------------------------
  # Job 1: Build Android APK
  # -------------------------------------------------------------------------
  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.jvmargs='-Xmx3072m -XX:+UseParallelGC'"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Version
        run: |
          if [[ "${{ github.ref_name }}" =~ ^v[0-9] ]]; then
            VERSION="${{ github.ref_name }}"
          else
            PUB_VERSION=$(grep '^version: ' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
            VERSION="v${PUB_VERSION}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Build Runner (Drift Models)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build Android APK
        run: flutter build apk --release

      # Note: If no custom android/key.properties exists, Flutter automatically signs
      # the release build with Android's default debug key. Since debug SHA-1 is registered
      # in Firebase, Google Sign-In works cleanly. We name it clean '-android.apk'.
      - name: Prepare Android Artifacts
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/gateletics-${{ env.VERSION }}-android.apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: artifacts/

  # -------------------------------------------------------------------------
  # Job 2: Build Windows Desktop App (Default Single ZIP Release)
  # -------------------------------------------------------------------------
  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    env:
      CL: "/MP" # Enable multi-threaded MSBuild C++ parallel compilation
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Version
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -match "^v[0-9]") {
            $VERSION = "${{ github.ref_name }}"
          } else {
            $PubLine = Get-Content pubspec.yaml | Select-String "^version:"
            $VERSION = "v" + $PubLine.Line.Split(" ")[1].Split("+")[0]
          }
          echo "VERSION=$VERSION" >> $env:GITHUB_ENV

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup --yes --no-progress

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Pub\Cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Build Runner (Drift Models)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Run Flutter Config Only (Generate Platform Files)
        run: flutter build windows --config-only

      - name: Strip Firebase from Windows C++ Build
        shell: bash
        run: python scripts/strip_firebase.py

      - name: Build Windows Desktop App
        run: flutter build windows --release --no-pub

      - name: Compress Windows Portable Release Bundle
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath gateletics-windows-${{ env.VERSION }}.zip

      - name: Compile Windows Setup Installer (Inno Setup)
        shell: pwsh
        run: |
          iscc /DMyAppVersion=${{ env.VERSION }} scripts/inno_setup.iss
          Copy-Item "scripts/Output/gateletics-windows-${{ env.VERSION }}-setup.exe" `
            -Destination "./gateletics-windows-${{ env.VERSION }}-setup.exe"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            gateletics-windows-${{ env.VERSION }}.zip
            gateletics-windows-${{ env.VERSION }}-setup.exe

  # -------------------------------------------------------------------------
  # Job 3: Build Linux Desktop App (Tarball, AppImage, & Debian .deb)
  # -------------------------------------------------------------------------
  build-linux:
    name: Build Linux Desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Version
        run: |
          if [[ "${{ github.ref_name }}" =~ ^v[0-9] ]]; then
            VERSION="${{ github.ref_name }}"
          else
            PUB_VERSION=$(grep '^version: ' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
            VERSION="v${PUB_VERSION}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Install Linux Build Prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev dpkg wget

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Build Runner (Drift Models)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build Linux Desktop App
        run: flutter build linux --release

      - name: Compress Linux Release Bundle (Tarball)
        run: |
          tar -czf gateletics-linux-${{ env.VERSION }}.tar.gz -C build/linux/x64/release/bundle .

      - name: Package Linux App as AppImage
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/lib
          mkdir -p AppDir/usr/share
          
          cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/
          
          echo '#!/bin/sh' > AppDir/AppRun
          echo 'HERE="$(dirname "$(readlink -f "${0}")")"' >> AppDir/AppRun
          echo 'exec "$HERE/usr/bin/gateletics" "$@"' >> AppDir/AppRun
          chmod +x AppDir/AppRun
          
          echo '[Desktop Entry]' > AppDir/gateletics.desktop
          echo 'Name=GATEletics' >> AppDir/gateletics.desktop
          echo 'Exec=gateletics' >> AppDir/gateletics.desktop
          echo 'Icon=gateletics' >> AppDir/gateletics.desktop
          echo 'Type=Application' >> AppDir/gateletics.desktop
          echo 'Categories=Utility;' >> AppDir/gateletics.desktop
          
          cp assets/icon.png AppDir/gateletics.png
          
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir gateletics-linux-${{ env.VERSION }}.AppImage
          rm -rf AppDir

      - name: Package Linux App as Debian Package (.deb)
        run: |
          CLEAN_VER="${VERSION#v}"
          mkdir -p debian_pkg/DEBIAN
          mkdir -p debian_pkg/usr/bin
          mkdir -p debian_pkg/usr/lib/gateletics
          mkdir -p debian_pkg/usr/share/applications
          mkdir -p debian_pkg/usr/share/pixmaps

          cp -r build/linux/x64/release/bundle/* debian_pkg/usr/lib/gateletics/
          ln -s /usr/lib/gateletics/gateletics debian_pkg/usr/bin/gateletics
          cp assets/icon.png debian_pkg/usr/share/pixmaps/gateletics.png

          cat << EOF > debian_pkg/usr/share/applications/gateletics.desktop
          [Desktop Entry]
          Name=GATEletics
          Comment=A syllabus and resource tracker for GATE exam preparation
          Exec=gateletics
          Icon=gateletics
          Terminal=false
          Type=Application
          Categories=Utility;Education;
          EOF

          cat << EOF > debian_pkg/DEBIAN/control
          Package: gateletics
          Version: ${CLEAN_VER}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Vishnunandan <https://github.com/vishnunandan555>
          Description: GATEletics - Syllabus, focus, and resource tracker for GATE exam preparation.
          EOF

          dpkg-deb --build debian_pkg gateletics-linux-${{ env.VERSION }}.deb
          rm -rf debian_pkg

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            gateletics-linux-${{ env.VERSION }}.tar.gz
            gateletics-linux-${{ env.VERSION }}.AppImage
            gateletics-linux-${{ env.VERSION }}.deb

  # -------------------------------------------------------------------------
  # Job 4: Build Web App (Vercel Production Deploy)
  # -------------------------------------------------------------------------
  build-web:
    name: Build Web Target
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Version
        run: |
          if [[ "${{ github.ref_name }}" =~ ^v[0-9] ]]; then
            VERSION="${{ github.ref_name }}"
          else
            PUB_VERSION=$(grep '^version: ' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
            VERSION="v${PUB_VERSION}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Build Runner (Drift Models)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build Web App
        run: flutter build web --release

      - name: Deploy Static Web Assets to Vercel
        uses: amondnet/vercel-action@v42
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./build/web
          vercel-version: 54.17.1

  # -------------------------------------------------------------------------
  # Job 5: Pull and Publish to GitHub Releases
  # -------------------------------------------------------------------------
  create-release:
    name: Create Consolidated GitHub Release
    needs: [build-android, build-windows, build-linux, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Version
        run: |
          if [[ "${{ github.ref_name }}" =~ ^v[0-9] ]]; then
            VERSION="${{ github.ref_name }}"
          else
            PUB_VERSION=$(grep '^version: ' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
            VERSION="v${PUB_VERSION}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create Release Directory
        run: mkdir -p release-files

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-build
          path: release-files

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: release-files

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: release-files

      - name: Publish Compiled Packages to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-files/gateletics-${{ env.VERSION }}-*.apk
            release-files/gateletics-windows-${{ env.VERSION }}.zip
            release-files/gateletics-windows-${{ env.VERSION }}-setup.exe
            release-files/gateletics-linux-${{ env.VERSION }}.AppImage
            release-files/gateletics-linux-${{ env.VERSION }}.tar.gz
            release-files/gateletics-linux-${{ env.VERSION }}.deb
          draft: false
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
